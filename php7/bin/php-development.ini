[PHP]

;;;;;;;;;;;;;;;;;;;
; About php.ini   ;
;;;;;;;;;;;;;;;;;;;
; PHP's initialization file, generally called php.ini, is responsible for
; configuring many of the aspects of PHP's behavior.
;
; PocketMine-MP / Genisys Dedicated CLI Runtime Configuration
; Mode: DEVELOPMENT (Plugin Development & Debugging)

;;;;;;;;;;;;;;;;;;;
; About this file ;
;;;;;;;;;;;;;;;;;;;
; This is the php.ini-development file optimized specifically for PocketMine-MP plugin developers.

;;;;;;;;;;;;;;;;;;;;
; php.ini Options  ;
;;;;;;;;;;;;;;;;;;;;
user_ini.filename =
user_ini.cache_ttl = 300

;;;;;;;;;;;;;;;;;;;;
; Language Options ;
;;;;;;;;;;;;;;;;;;;;

engine = On
short_open_tag = Off
precision = 14
output_buffering = Off
zlib.output_compression = Off
implicit_flush = Off
unserialize_callback_func =
serialize_precision = -1

realpath_cache_size = 4M
realpath_cache_ttl = 120

zend.enable_gc = On
zend.assertions = 1
zend.exception_ignore_args = Off
zend.exception_string_param_max_len = 15

;;;;;;;;;;;;;;;;;
; Miscellaneous ;
;;;;;;;;;;;;;;;;;

expose_php = On

;;;;;;;;;;;;;;;;;;;
; Resource Limits ;
;;;;;;;;;;;;;;;;;;;

max_execution_time = 0
max_input_time = -1
memory_limit = -1

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Error handling and logging ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
ignore_repeated_errors = Off
ignore_repeated_source = Off
report_memleaks = On

;;;;;;;;;;;;;;;;;
; Data Handling ;
;;;;;;;;;;;;;;;;;

variables_order = "GPCS"
request_order = "GP"
register_argc_argv = On
auto_globals_jit = On

post_max_size = 8M
auto_prepend_file =
auto_append_file =
default_mimetype = "text/html"
default_charset = "UTF-8"

;;;;;;;;;;;;;;;;;;;;;;;;;
; Paths and Directories ;
;;;;;;;;;;;;;;;;;;;;;;;;;

doc_root =
user_dir =
extension_dir = "../lib/modules"
enable_dl = Off

;;;;;;;;;;;;;;;;
; File Uploads ;
;;;;;;;;;;;;;;;;

file_uploads = Off

;;;;;;;;;;;;;;;;;;
; Fopen wrappers ;
;;;;;;;;;;;;;;;;;;

allow_url_fopen = On
allow_url_include = Off
default_socket_timeout = 60

;;;;;;;;;;;;;;;;;;;;;;
; Dynamic Extensions ;
;;;;;;;;;;;;;;;;;;;;;;

extension=sockets
extension=pmmpthread
extension=yaml
extension=curl
extension=openssl
extension=mbstring
extension=gmp
extension=zlib
extension=phar
extension=zip
extension=bcmath
extension=ctype
extension=sqlite3
extension=pdo_sqlite
extension=mysqli
extension=mysqlnd
extension=pdo
extension=pdo_mysql

zend_extension=opcache

;;;;;;;;;;;;;;;;;;;
; Module Settings ;
;;;;;;;;;;;;;;;;;;;
[ffi]
ffi.enable=true
ffi.cache_check=1

[CLI Server]
cli_server.color = On

[Date]
date.timezone = UTC

[Pcre]
pcre.backtrack_limit = 1000000
pcre.recursion_limit = 1000000
pcre.jit = 1

[Phar]
phar.readonly = Off
phar.require_hash = On

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.max_wasted_percentage = 10
opcache.use_cwd = 1

; CRITICAL DEVELOPER SETTING:
; Enable timestamp validation (1) so edits to plugin files are picked up on the fly
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

opcache.save_comments = 1
opcache.record_warnings = 1
opcache.enable_file_override = 0
opcache.optimization_level = 0x7FFFBFFF
opcache.max_file_size = 0
opcache.consistency_checks = 0
opcache.force_restart_timeout = 180
opcache.protect_memory = 0
opcache.huge_code_pages = 0
opcache.file_update_protection = 1

[JIT]
opcache.jit = tracing
opcache.jit_buffer_size = 64M
