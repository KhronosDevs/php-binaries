[PHP]

;;;;;;;;;;;;;;;;;;;
; About php.ini   ;
;;;;;;;;;;;;;;;;;;;
; PHP's initialization file, generally called php.ini, is responsible for
; configuring many of the aspects of PHP's behavior.
;
; PocketMine-MP / Genisys Dedicated CLI Runtime Configuration
; Mode: PRODUCTION (24/7 High-Performance Server)

;;;;;;;;;;;;;;;;;;;
; About this file ;
;;;;;;;;;;;;;;;;;;;
; This is the php.ini-production file optimized specifically for PocketMine-MP and Genisys
; Bedrock Edition Minecraft servers running on CLI PHP 8.2+.

;;;;;;;;;;;;;;;;;;;;
; php.ini Options  ;
;;;;;;;;;;;;;;;;;;;;
user_ini.filename =
user_ini.cache_ttl = 300

;;;;;;;;;;;;;;;;;;;;
; Language Options ;
;;;;;;;;;;;;;;;;;;;;

engine = On
short_open_tag = Off
precision = 14
output_buffering = Off
zlib.output_compression = Off
implicit_flush = Off
unserialize_callback_func =
serialize_precision = -1

; realpath_cache stores resolved filesystem paths.
realpath_cache_size = 8M
realpath_cache_ttl = 3600

; Circular reference Garbage Collector
zend.enable_gc = On

; Disable assertions in production for zero runtime overhead
zend.assertions = -1

; Ignore arguments in stack traces for performance and security
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0

;;;;;;;;;;;;;;;;;
; Miscellaneous ;
;;;;;;;;;;;;;;;;;

expose_php = Off

;;;;;;;;;;;;;;;;;;;
; Resource Limits ;
;;;;;;;;;;;;;;;;;;;

max_execution_time = 0
max_input_time = -1
memory_limit = -1

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Error handling and logging ;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT & ~E_NOTICE
display_errors = Off
display_startup_errors = Off
log_errors = On
ignore_repeated_errors = Off
ignore_repeated_source = Off
report_memleaks = On

;;;;;;;;;;;;;;;;;
; Data Handling ;
;;;;;;;;;;;;;;;;;

variables_order = "GPCS"
request_order = "GP"
register_argc_argv = On
auto_globals_jit = On

post_max_size = 8M
auto_prepend_file =
auto_append_file =
default_mimetype = "text/html"
default_charset = "UTF-8"

;;;;;;;;;;;;;;;;;;;;;;;;;
; Paths and Directories ;
;;;;;;;;;;;;;;;;;;;;;;;;;

doc_root =
user_dir =
extension_dir = "../lib/modules"
enable_dl = Off

;;;;;;;;;;;;;;;;
; File Uploads ;
;;;;;;;;;;;;;;;;

file_uploads = Off

;;;;;;;;;;;;;;;;;;
; Fopen wrappers ;
;;;;;;;;;;;;;;;;;;

allow_url_fopen = On
allow_url_include = Off
default_socket_timeout = 60

;;;;;;;;;;;;;;;;;;;
; Module Settings ;
;;;;;;;;;;;;;;;;;;;
[ffi]
ffi.enable=true
ffi.cache_check=0

[CLI Server]
cli_server.color = On

[Date]
date.timezone = UTC

[Pcre]
pcre.backtrack_limit = 1000000
pcre.recursion_limit = 1000000
pcre.jit = 1

[Phar]
phar.readonly = On
phar.require_hash = On

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 30000
opcache.max_wasted_percentage = 10
opcache.use_cwd = 1

; CRITICAL: Disable timestamp validation in production (0) to eliminate stat() disk I/O calls
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Preserve PHPDoc comments and PHP 8 Attributes for PocketMine reflection
opcache.save_comments = 1
opcache.record_warnings = 0
opcache.enable_file_override = 1
opcache.optimization_level = 0x7FFFBFFF
opcache.max_file_size = 0
opcache.consistency_checks = 0
opcache.force_restart_timeout = 180
opcache.protect_memory = 0
opcache.huge_code_pages = 0
opcache.file_update_protection = 0

[JIT]
; Enable Tracing JIT for PocketMine hot tick loops
opcache.jit = tracing
opcache.jit_buffer_size = 128M
opcache.jit_hot_loop = 64
opcache.jit_hot_func = 127
opcache.jit_hot_return = 8
opcache.jit_hot_side_exit = 8
