name: Compile Khronos PHP Binaries

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Compile Linux (Ubuntu)
    runs-on: ubuntu-22.04
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      # build.sh outputs to dist/php7/ (docker build, Debian Bullseye baseline)
      - name: Execute KhronosDevs script
        run: |
          chmod +x build.sh
          ./build.sh
          # build.sh runs in Docker as root, so dist/php7/ is root-owned:
          # copy the ini files with sudo or cp fails with Permission denied.
          sudo cp php.ini dist/php7/bin/php.ini
          sudo cp php-production.ini dist/php7/bin/php.ini-production
          sudo cp php-development.ini dist/php7/bin/php.ini-development

      - name: Smoke test (Linux)
        run: |
          PHP=dist/php7/bin/php
          "$PHP" -v
          "$PHP" -m
          "$PHP" -i | grep "Thread Safety => enabled"
          for ext in FFI pmmpthread sockets mbstring yaml zlib json phar curl PDO sqlite3 mysqlnd; do
            "$PHP" -m | grep -qx "$ext" || { echo "Missing extension: $ext"; exit 1; }
          done
          "$PHP" -m | grep -q "Zend OPcache"

      - name: Upload linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: PHP-8.2-Linux-x64
          path: dist/php7/

  build-windows:
    name: Compile Windows (VS 2022)
    runs-on: windows-2022
    env:
      # Khronos php.ini ships opcache.jit=tracing, so JIT support must be compiled in
      PHP_JIT_SUPPORT: "1"
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      # Caches the php-sdk, the prebuilt deps (deps-php-8.2-release) and the
      # custom lib build dir. The compile script reuses whatever exists.
      - name: Cache PHP SDK and dependencies
        uses: actions/cache@v4
        with:
          path: C:\pocketmine-php
          key: php-sdk-deps-8.2-vs16-release-x64-v1
          restore-keys: |
            php-sdk-deps-8.2-vs16-release-x64-

      # In-repo, versioned script: no downloads from third-party mutable
      # branches. PHP version and extensions are pinned by the script itself
      # (PHP 8.2.30, Khronos extension set, FFI included).
      - name: Compile PHP for Windows (Khronos script)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\windows-compile-vs.ps1
        shell: pwsh

      # The script installs to bin\php7\bin\php.exe (same layout as the Linux
      # artifact and start.cmd) and already runs its own smoke test
      # (php -v, extension check, ZTS). This step validates the layout from
      # the server root, exactly like start.cmd does.
      # Note: no -d extension=ffi here: the generated php.ini already loads
      # every shared DLL (including php_ffi.dll), and loading it twice
      # triggers "Module FFI is already loaded". PHP code needs && (not the
      # PowerShell -and operator).
      - name: Smoke test (Windows, from server root)
        run: |
          $php = "bin\php7\bin\php.exe"
          if (-not (Test-Path $php)) { Write-Host "php.exe not found at $php"; exit 1 }
          & $php -r "exit((class_exists('FFI') && class_exists('Thread')) ? 0 : 1);"
          if ($LASTEXITCODE -ne 0) { Write-Host "FFI or pmmpthread not usable"; exit 1 }
        shell: powershell

      - name: Upload compile log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-compile-log
          path: compile.log
          if-no-files-found: ignore

      - name: Upload windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PHP-8.2-Windows-x64
          path: bin/php7/
